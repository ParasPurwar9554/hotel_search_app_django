<!DOCTYPE html>
<html lang="en">

<head>
    <title>Django Hotel App</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

    <div id="app" class="container mt-5 pt-5">

        <div class="row">

            <!-- Amenities -->
            <div class="col-md-4">
                <label class="form-label">Choose Amenities:</label>

                <select class="form-control" v-model="selectedAmenity">
                    <option value="">Choose</option>

                    {% for amenity in amenities %}
                    <option value="{{ amenity.id }}">
                        {{ amenity.amenity }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Sort -->
            <div class="col-md-4">
                <label class="form-label">Sort By:</label>
                <select class="form-control" v-model="sortOrder">
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>

            <!-- Price -->
            <div class="col-md-4">
                <label for="customRange2" class="form-label">
                    Select Price: [[ price ]]
                </label>

                <input type="range" class="form-range" min="300" max="10000" id="customRange2" v-model="price">
            </div>

        </div>

        <div class="mt-4">
            <h4>[[ message ]]</h4>
        </div>


        <!-- Hotel Cards -->
        <div class="row mt-5 pt-5">

            <div class="col-md-4 mb-4" v-for="hotel in hotels" :key="hotel.id">

                <div class="card shadow-lg h-100">

                    <img :src="'/media/' + hotel.banner_image" class="card-img-top" alt="Hotel"
                        style="height: 220px; object-fit: cover;">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">
                            [[ hotel.hotel_name ]]
                        </h5>

                        <p class="card-text">
                            [[ hotel.hotel_description.substr(0,30) ]]
                        </p>

                        <h5 class="text-primary">
                            ₹[[ hotel.hotel_price ]]
                        </h5>
                        <div class="mb-3">

                            <span v-for="amenity in hotel.amenities" :key="amenity.id" class="badge bg-secondary me-1">
                                [[ amenity.amenity ]]
                            </span>

                        </div>

                        <a href="#" class="btn btn-primary mt-auto">
                            View Hotel
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
    const { createApp } = Vue;

    createApp({
        delimiters: ['[[', ']]'],

        data() {
            return {
                hotels: [],
                message: 'Hello from Vue 3 via CDN!',
                selectedAmenity: '',
                sortOrder: 'asc',
                price: 5
            }
        },

        methods: {

            getHotels() {

                let params = new URLSearchParams();
                if (this.selectedAmenity) {
                    params.append('amenities', this.selectedAmenity);
                }

                if (this.sortOrder) {
                    params.append('sort_by', this.sortOrder);
                }
                if (this.price > 0) {
                    params.append('amount', this.price * 1000);
                }

                fetch('/api/get-hotels/?' + params.toString())
                    .then(response => response.json())
                    .then(result => {
                        console.log(result);
                        this.hotels = result;
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            }
        },
        watch: {
            selectedAmenity() {
                this.getHotels();
            },

            sortOrder() {
                this.getHotels();
            },

            price() {
                this.getHotels();
            }

        },

        created() {
            this.getHotels();
        }

    }).mount('#app');
</script>

</body>

</html>
